[package]
name = "mxm-fx-oldify-host-tests"
description = "mxm-fx-oldify hosted by MXM Player: effect chain through the real host, against its release bundle. The slow tier: `cargo test -p mxm-fx-oldify` never builds the player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# The tests are in `tests/`; the library is empty and not test-built.
test = false
doctest = false

[dev-dependencies]
# The effect's silence threshold, so the tests judge the source's end as the effect does.
mxm-fx-oldify-dsp.workspace = true
mxm-player.workspace = true
mxm-player-harness.workspace = true
